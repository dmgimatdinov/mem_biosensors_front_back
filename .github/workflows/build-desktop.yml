name: Build Desktop Portable Bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish as a release (for example v1.0.0-desktop)'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*-desktop'
      - 'v*.*.*'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            desktop/requirements-desktop.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-desktop.txt

      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend assets
        run: |
          cd frontend
          npm run build

      - name: Generate version and changelog
        shell: bash
        run: |
          chmod +x .github/workflows/scripts/generate-changelog.sh
          .github/workflows/scripts/generate-changelog.sh "${GITHUB_REF_NAME:-v1.0.0-desktop}"

      - name: Build Windows portable bundle
        shell: bash
        run: |
          pyinstaller desktop/mem_biosensors.spec --clean --noconfirm
          mkdir -p dist/mem_biosensors_portable
          cp -R frontend/out/. dist/mem_biosensors_portable/frontend/ 2>/dev/null || true
          cp desktop/README.md dist/mem_biosensors_portable/README.txt
          cp desktop/README.md dist/mem_biosensors_portable/LICENSE.txt
          cp desktop/CHANGELOG.txt dist/mem_biosensors_portable/CHANGELOG.txt
          if [ -f dist/mem_biosensors_portable/MemBiosensors.exe ]; then
            cp dist/mem_biosensors_portable/MemBiosensors.exe dist/mem_biosensors_portable/mem_biosensors.exe
          fi
          printf 'SHA256 for the archive will be generated in the next step.\n' > dist/mem_biosensors_portable/SHA256SUMS.txt
          python -c "from pathlib import Path; import shutil; root = Path.cwd(); dist_dir = root / 'dist' / 'mem_biosensors_portable'; out_zip = root / 'desktop' / 'dist' / f\"MemBiosensors_Portable_v{(Path('desktop/VERSION').read_text().strip() if Path('desktop/VERSION').exists() else '1.0.0')}_win-x64.zip\"; out_zip.parent.mkdir(parents=True, exist_ok=True); shutil.make_archive(str(out_zip.with_suffix('')), 'zip', dist_dir); print(f'Created {out_zip}')"

      - name: Verify artifact
        shell: bash
        run: |
          chmod +x .github/workflows/scripts/verify-artifact.sh
          .github/workflows/scripts/verify-artifact.sh "$(ls desktop/dist/MemBiosensors_Portable_v*_win-x64.zip | head -n 1)"

      - name: Compute SHA256
        shell: bash
        run: |
          python -c "from pathlib import Path; import hashlib; archive = next(Path('desktop/dist').glob('MemBiosensors_Portable_v*_win-x64.zip')); sha = hashlib.sha256(archive.read_bytes()).hexdigest(); Path('desktop/dist/sha256.txt').write_text(f'{sha}  {archive.name}\\n', encoding='utf-8'); print(sha)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemBiosensors_Portable
          path: desktop/dist/MemBiosensors_Portable_v*_win-x64.zip

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: MemBiosensors_Portable_SHA256
          path: desktop/dist/sha256.txt

  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MemBiosensors_Portable
          path: ./artifacts

      - name: Download checksum manifest
        uses: actions/download-artifact@v4
        with:
          name: MemBiosensors_Portable_SHA256
          path: ./artifacts

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          elif [ -n "${GITHUB_REF_NAME:-}" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v1.0.0-desktop"
          fi
          VERSION_VALUE="${VERSION#v}"
          VERSION_VALUE="${VERSION_VALUE%-desktop}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_value=$VERSION_VALUE" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: MemBiosensors Portable ${{ steps.version.outputs.version_value }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/*.zip
            ./artifacts/sha256.txt
          body: |
            ## Release Notes

            Portable Windows build for MemBiosensors.

            ### Assets
            - Portable zip archive
            - SHA256 checksum manifest

      - name: Log artifact size
        shell: bash
        run: |
          ls -lh ./artifacts/*.zip
          wc -c ./artifacts/*.zip
